[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.3.0"
description = "A voice-operated desktop assistant"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "CC BY-NC 4.0"}
authors = [
    {name = "Brian", email = "brian@example.com"}
]
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "av==19.0.2",
    "certifi==2026.10.19",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "cloudpickle==3.1.2",
    "colorama==0.4.6",
    "comtypes==1.4.17",
    "ctranslate2==4.8.3",
    "edge-tts==7.3.1",
    "et-xmlfile==2.0.0",
    "faster-whisper==1.2.1",
    "filelock==4.2.4",
    "flatbuffers==25.12.19",
    "frozenlist==1.8.0",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.7.0",
    "httpcore2==2.16.0",
    "httpx2==2.16.0",
    "huggingface-hub==2.2.0",
    "idna==3.20",
    "iniconfig==2.3.1",
    "joblib==1.6.0",
    "lxml==6.1.3",
    "multidict==7.1.0",
    "narwhals==2.27.1",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "openpyxl==3.1.5",
    "openwakeword==0.6.0",
    "packaging==26.3",
    "pillow==13.0.0",
    "pluggy==1.7.0",
    "propcache==0.5.4",
    "protobuf==7.36.2",
    "psutil==7.2.2",
    "pycaw==20260927",
    "pycparser==3.11",
    "pyflakes==4.0.3",
    "Pygments==2.21.0",
    "pynput==1.8.2",
    "PyPDF2==3.0.1",
    "pystray==0.19.5",
    "pytest==9.1.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "pywin32==312",
    "pywinauto==0.6.9",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "Send2Trash==2.1.0",
    "six==1.17.0",
    "sounddevice==0.5.6",
    "tabulate==0.10.0",
    "threadpoolctl==3.7.0",
    "tokenizers==0.23.3",
    "tqdm==4.70.1",
    "truststore==0.10.5",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "yarl==1.25.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.0",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN401", "B008", "BLE001", "TRY003", "T201", "T203"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
